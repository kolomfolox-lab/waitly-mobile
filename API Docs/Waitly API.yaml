          type: string
          title: Фамилия
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        avatar:
          type: string
          format: uri
          nullable: true
        is_active:
          type: boolean
          title: Активный
          description: Отметьте, если пользователь должен считаться активным. Уберите
            эту отметку вместо удаления учётной записи.
      required:
      - full_name
      - id
      - phone_number
      - username
    UserCreate:
      type: object
      description: User creation serializer.
      properties:
        username:
          type: string
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Адрес электронной почты
          maxLength: 254
        phone_number:
          type: string
          nullable: true
          maxLength: 128
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        password:
          type: string
          writeOnly: true
          minLength: 6
      required:
      - password
      - username
    WorkShift:
      type: object
      description: Work shift serializer.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: integer
        user_name:
          type: string
          readOnly: true
        restaurant:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        orders_count:
          type: integer
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - orders_count
      - restaurant
      - started_at
      - total_amount
      - user
      - user_name
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

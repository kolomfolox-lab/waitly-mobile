components:
  schemas:
    Booking:
      type: object
      description: Booking serializer.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        table:
          type: string
          format: uuid
        table_number:
          type: string
          readOnly: true
        booking_date:
          type: string
          format: date
        booking_time:
          type: string
          format: time
        guest_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        client_phone:
          type: string
          maxLength: 20
        client_telegram:
          type: string
          nullable: true
          maxLength: 100
        created_by:
          type: integer
          nullable: true
        created_by_name:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - booking_date
      - booking_time
      - client_phone
      - created_at
      - created_by_name
      - guest_count
      - id
      - table
      - table_number
      - updated_at
    BookingCreate:
      type: object
      description: Booking creation serializer.
      properties:
        table:
          type: string
          format: uuid
        booking_date:
          type: string
          format: date
        booking_time:
          type: string
          format: time
        guest_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        client_phone:
          type: string
          maxLength: 20
        client_telegram:
          type: string
          nullable: true
          maxLength: 100
      required:
      - booking_date
      - booking_time
      - client_phone
      - guest_count
      - table
    ChainCreate:
      type: object
      description: Chain creation serializer.
      properties:
        name:
          type: string
          maxLength: 255
        subdomain:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        owner_email:
          type: string
          format: email
          writeOnly: true
        owner_phone:
          type: string
          writeOnly: true
        owner_password:
          type: string
          writeOnly: true
          minLength: 6
        owner_first_name:
          type: string
          writeOnly: true
        owner_last_name:
          type: string
          writeOnly: true
      required:
      - name
      - owner_email
      - owner_password
      - owner_phone
      - subdomain
    DailyAnalytics:
      type: object
      description: Daily analytics serializer.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        restaurant:
          type: string
          format: uuid
        restaurant_name:
          type: string
          readOnly: true
        date:
          type: string
          format: date
        orders_count:
          type: integer
          readOnly: true
        total_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        time_saved_minutes:
          type: integer
          readOnly: true
          description: Calculated as orders_count * 3
        top_dishes:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date
      - id
      - orders_count
      - restaurant
      - restaurant_name
      - time_saved_minutes
      - top_dishes
      - total_revenue
      - updated_at
    Dish:
      type: object
      description: Dish serializer.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        restaurant:
          type: string
          format: uuid
        category:
          type: string
          format: uuid
          nullable: true
        category_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 200
        name_uz:
          type: string
          maxLength: 200
        name_en:
          type: string
          maxLength: 200
        description:
          type: string
        description_uz:
          type: string
        description_en:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        image:
          type: string
          format: uri
          nullable: true
        cooking_time:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Estimated cooking time in minutes
        is_available:
          type: boolean
        unavailable_reason:
          type: string
          description: Reason for unavailability (e.g., "No products")
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category_name
      - created_at
      - id
      - name
      - price
      - restaurant
      - updated_at
    DishCreateUpdate:
      type: object
      description: Dish create/update serializer.
      properties:
        restaurant:
          type: string
          format: uuid
        category:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 200
        name_uz:
          type: string
          maxLength: 200
        name_en:
          type: string
          maxLength: 200
        description:
          type: string
        description_uz:
          type: string
        description_en:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        image:
          type: string
          format: uri
          nullable: true
        cooking_time:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Estimated cooking time in minutes
        is_available:
          type: boolean
        unavailable_reason:
          type: string
          description: Reason for unavailability (e.g., "No products")
      required:
      - name
      - price
      - restaurant
    DurationMonthsEnum:
      enum:
      - 1
      - 3
      - 6
      - 12
      - 24
      type: integer
      description: |-
        * `1` - 1 Month
        * `3` - 3 Months
        * `6` - 6 Months
        * `12` - 12 Months
        * `24` - 24 Months
    MenuCategory:
      type: object
      description: Menu category serializer.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        restaurant:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        name_uz:
          type: string
          maxLength: 100
        name_en:
          type: string
          maxLength: 100
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Display order
        dishes_count:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - dishes_count
      - id
      - name
      - restaurant
    Order:
      type: object
      description: Order serializer.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        restaurant:
          type: string
          format: uuid
        table:
          type: string
          format: uuid
        table_number:
          type: string
          readOnly: true
        waiter:
          type: integer
          nullable: true
        waiter_name:
          type: string
          readOnly: true
        cook:
          type: integer
          nullable: true
        shift:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        estimated_time:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Estimated cooking time in minutes
        extra_time:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Additional delay time in minutes
        delay_message:
          type: string
          readOnly: true
          description: AI-generated apology message for delay
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        accepted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ready_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        delivered_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - accepted_at
      - created_at
      - delay_message
      - delivered_at
      - id
      - items
      - ready_at
      - restaurant
      - table
      - table_number
      - total_amount
      - waiter_name
    OrderCreate:
      type: object
      description: Create order serializer.
      properties:
        table_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
      required:
      - items
      - table_id
    OrderItem:
      type: object
      description: Order item serializer.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        dish:
          type: string
          format: uuid
        dish_name:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: Price at time of order
        notes:
          type: string
          description: Special instructions (e.g., "No cheese")
      required:
      - dish
      - dish_name
      - id
      - price
